name: Lint


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  test:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.15.2'

      - name: Install transliteration build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential default-jdk-headless ant libmecab-dev

      - name: Install Requirements
        run: pip install ".[dev,mouthing,server]"

      - name: Lint Code
        run: pylint signwriting
